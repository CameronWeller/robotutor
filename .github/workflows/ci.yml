name: Robotutor contributor checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: contributor-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --manifest-path lab/Cargo.toml --all-targets
      - run: cargo test --locked --manifest-path lms/Cargo.toml
      - run: python3 -m unittest discover -s tests
      - name: Exercise transcript tooling with disposable fixtures
        run: |
          sudo apt-get update && sudo apt-get install -y age
          python3 -m unittest discover -s tools
      - name: Verify contributor credentials can fetch only the public code
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          test ! -e logs/.archive-format
          git ls-remote --exit-code origin refs/heads/main > /dev/null
          archive=$(git config -f .gitmodules --get submodule.logs.url)
          if git ls-remote "$archive" > /dev/null 2> "$RUNNER_TEMP/archive-error"; then
            echo "Contributor credentials could read the private archive."
            exit 1
          fi
          grep -Fqi 'repository not found' "$RUNNER_TEMP/archive-error"
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the Rust desktop
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/lab/target"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          cargo test --locked --manifest-path lab/Cargo.toml --bin tutor
          cargo test --locked --manifest-path desktop/native/Cargo.toml
          cargo build --locked --manifest-path desktop/native/Cargo.toml
          cargo test --locked --manifest-path lms/Cargo.toml --all-targets
          cargo build --locked --manifest-path lms/Cargo.toml
          cargo build --locked --manifest-path lab/Cargo.toml --bin tutor
          cargo test --locked --manifest-path desktop/course-window/Cargo.toml --all-targets
          cargo build --locked --manifest-path desktop/course-window/Cargo.toml
      - name: Exercise the course webview handoff
        run: |
          export ROBOTUTOR_COURSES_BIN="$CARGO_TARGET_DIR/debug/robotutor-courses"
          python3 desktop/check_native_courses.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise Chromium research on macOS
        working-directory: desktop/chromium
        run: |
          npm ci --no-audit
          node install.cjs
          export ROBOTUTOR_RESEARCH_HELPER="$GITHUB_WORKSPACE/lab/target/debug/robotutor-research"
          node_modules/.bin/electron smoke.cjs "$(mktemp -d)"
  research-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb
      - run: cargo test --locked --manifest-path desktop/course-window/Cargo.toml --bin robotutor-research
      - run: cargo build --locked --manifest-path desktop/course-window/Cargo.toml --bin robotutor-research
      - working-directory: desktop/chromium
        run: |
          npm ci --no-audit
          node node_modules/electron/install.js
          sudo install -D -o root -g root -m 4755 node_modules/electron/dist/chrome-sandbox /usr/local/libexec/robotutor/chrome-sandbox
          node install.cjs
          export ROBOTUTOR_RESEARCH_HELPER="$GITHUB_WORKSPACE/desktop/course-window/target/debug/robotutor-research"
          xvfb-run -a node_modules/.bin/electron smoke.cjs "$(mktemp -d)"
  research-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --manifest-path desktop/course-window/Cargo.toml --bin robotutor-research
      - name: Exercise Windows transcript capture and append behavior
        run: |
          python -m unittest discover -s tools -p test_append_transcript.py
          python -m unittest discover -s tools -p test_session_archive.py
