[package]
name = "robotutor-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Deterministic teaching kernel, LTLf monitors and calibrated simulations for Robotutor"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
stateright = "0.31"

[profile.release]
debug = 1
