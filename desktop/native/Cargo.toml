[package]
name = "robotutor-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
