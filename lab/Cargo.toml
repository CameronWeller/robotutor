[package]
name = "tutor_lab"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline design experiments for a longitudinal teaching policy"

[dependencies]
crossterm = { version = "0.28.1", default-features = false, features = ["events", "windows"] }
libc = "0.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
telo = "=0.1.0"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }
rpassword = "7"
